name: Backup
on: 
  schedule:
    - cron: '0 0 * * *'  # every day at midnight
  workflow_dispatch: # allow manual triggering
    inputs:
      logLevel:
        description: 'Log level'     
        required: true
        default: 'warning'
jobs:
  backup:
    environment: Heroku-DB-Backup
    name: Download Heroku Backup Replace Oldest Local Backup
    runs-on: ubuntu-latest
    steps:
      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install-ubuntu.sh | sh
      - name: Download Backup
        env: 
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_AUTH_TOKEN: ${{ secrets.HEROKU_AUTH_TOKEN }}
          HEROKU_OAUTH_TOKEN: ${{ secrets.HEROKU_OAUTH_TOKEN }}
        run: |
          HEROKU_API_KEY="${HEROKU_API_KEY:-${HEROKU_AUTH_TOKEN:-${HEROKU_OAUTH_TOKEN:-}}}"
          export HEROKU_API_KEY
          if [ -z "${HEROKU_API_KEY}" ]; then
            echo "Missing Heroku API key. Set HEROKU_API_KEY (or HEROKU_AUTH_TOKEN/HEROKU_OAUTH_TOKEN) in GitHub Actions secrets." >&2
            exit 1
          fi
          mkdir -p ./backups/
          filename=$(date +"%m_%d_%y").dump
          heroku pg:backups:capture -a opencreorg
          heroku pg:backups:download -a opencreorg --output=./backups/"${filename}"
      - uses: actions/upload-artifact@v4
        with:
          name: opencreorg_db_backup
          path: ./backups/*.dump
          if-no-files-found: error
          retention-days: 90 # 3 months of backups should be enough
